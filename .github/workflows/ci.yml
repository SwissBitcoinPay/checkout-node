name: CI

# Every pull request and every push to main: the pinned copy of the specification, lint, format,
# types, tests (against its conformance vectors, local relays and fakes: no network) and build, on
# every supported version of Node. GitHub-hosted runners only: on a public repository, a pull
# request from a fork must never run on a self-hosted runner (GitHub's advice).
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json "engines": Node 22 or later: every release line Node.js supports.
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache (`cache: npm`): a few dependencies, which `npm ci` installs in seconds.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm ls --all
      - run: npm run spec:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # What `npm publish` would send: dist/, README, CHANGELOG, LICENSE, package.json.
      - run: npm pack --dry-run
